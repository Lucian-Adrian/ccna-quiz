name: Deploy GitHub Pages

on:
  push:
    branches:
      - initial
      - second
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          path: current

      - name: Checkout initial branch
        uses: actions/checkout@v4
        with:
          ref: initial
          path: initial-branch

      - name: Checkout second branch
        uses: actions/checkout@v4
        with:
          ref: second
          path: second-branch

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: initial-branch

      - name: Install second branch dependencies
        run: pnpm install --frozen-lockfile
        working-directory: second-branch

      - name: Build initial site
        run: pnpm build
        working-directory: initial-branch

      - name: Build second site
        run: pnpm build
        working-directory: second-branch

      - name: Assemble Pages site
        run: |
          mkdir -p site/initial site/second
          cp -R initial-branch/dist/. site/initial/
          cp -R second-branch/dist/. site/second/
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta name="theme-color" content="#07111f" />
              <title>CCNA Quiz Hub</title>
              <style>
                :root {
                  color-scheme: dark;
                  --bg: #07111f;
                  --panel: rgba(15, 27, 43, 0.95);
                  --text: #f2f6ff;
                  --muted: #9eb0ca;
                  --line: rgba(160, 182, 214, 0.16);
                  --cyan: #67e8f9;
                  --amber: #fbbf24;
                }
                * { box-sizing: border-box; }
                body {
                  margin: 0;
                  min-height: 100vh;
                  display: grid;
                  place-items: center;
                  padding: 24px;
                  font-family: Georgia, "Times New Roman", serif;
                  color: var(--text);
                  background:
                    radial-gradient(circle at top left, rgba(103, 232, 249, 0.17), transparent 34%),
                    radial-gradient(circle at top right, rgba(251, 191, 36, 0.14), transparent 28%),
                    linear-gradient(180deg, #04101d 0%, #07111f 55%, #050b15 100%);
                }
                main {
                  width: min(860px, 100%);
                  border: 1px solid var(--line);
                  border-radius: 32px;
                  padding: 28px;
                  background: var(--panel);
                  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.48);
                }
                p {
                  color: var(--muted);
                  line-height: 1.6;
                }
                .eyebrow {
                  margin: 0 0 10px;
                  color: var(--cyan);
                  letter-spacing: 0.2em;
                  text-transform: uppercase;
                  font-size: 0.78rem;
                }
                h1 {
                  margin: 0;
                  font-size: clamp(2.1rem, 7vw, 4rem);
                  line-height: 0.95;
                  letter-spacing: -0.04em;
                }
                .grid {
                  display: grid;
                  gap: 14px;
                  margin-top: 24px;
                }
                .card {
                  display: block;
                  padding: 18px;
                  border-radius: 24px;
                  border: 1px solid var(--line);
                  text-decoration: none;
                  color: var(--text);
                  background: rgba(255, 255, 255, 0.03);
                }
                .card:hover,
                .card:focus-visible {
                  outline: none;
                  border-color: rgba(103, 232, 249, 0.42);
                  background: rgba(255, 255, 255, 0.06);
                }
                .card strong {
                  display: block;
                  margin-bottom: 6px;
                  font-size: 1.2rem;
                }
                .chip {
                  display: inline-block;
                  margin-top: 8px;
                  padding: 6px 10px;
                  border-radius: 999px;
                  color: var(--amber);
                  background: rgba(255, 255, 255, 0.06);
                  font-size: 0.8rem;
                  text-transform: uppercase;
                  letter-spacing: 0.08em;
                }
              </style>
            </head>
            <body>
              <main>
                <p class="eyebrow">GitHub Pages Hub</p>
                <h1>Choose your CCNA deck.</h1>
                <p>The repo now publishes both GitHub Pages variants side by side so you can switch between the original branch and the new branch without redeploying.</p>
                <section class="grid">
                  <a class="card" href="./initial/">
                    <strong>Initial</strong>
                    <span>Open the version published from branch <code>initial</code>.</span>
                    <span class="chip">/initial/</span>
                  </a>
                  <a class="card" href="./second/">
                    <strong>Second</strong>
                    <span>Open the version published from branch <code>second</code>.</span>
                    <span class="chip">/second/</span>
                  </a>
                </section>
              </main>
            </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
